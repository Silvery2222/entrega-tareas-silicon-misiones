<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Caracteres</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

        <main>
        <h1>Contador de Caracteres</h1>
        
        <!-- El textarea principal donde el usuario escribe -->
        <textarea id="texto" placeholder="Comienza a escribir aquí..."></textarea>

        <!-- Botón Limpiar -->
        <button id="btnLimpiar" class="btn-limpiar">Limpiar texto</button>

        <!-- Fila de tarjetas con los resultados analizados -->
        <div class="contenedor-tarjetas">
            <div class="tarjeta">
                <h3>Caracteres</h3>
                <span id="caracteres">0</span>
            </div>
            <div class="tarjeta">
                <h3>Palabras</h3>
                <span id="palabras">0</span>
            </div>
            <div class="tarjeta">
                <h3>Sin espacios</h3>
                <span id="sinEspacios">0</span>
            </div>
            <div class="tarjeta">
                <h3>Restantes</h3>
                <span id="restantes">210</span>
            </div>
        </div>
    </main>


    <script src="app.js"></script>
</body>
</html>
